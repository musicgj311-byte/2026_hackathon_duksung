[project]
name = "shield-backend"
version = "0.1.0"
description = "사기문자 방패 판정·보호자 알림 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
