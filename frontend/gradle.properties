# 프로젝트 전체에 적용되는 Gradle 설정입니다.
# Android Studio의 별도 설정이 있으면 이 파일보다 우선 적용될 수 있습니다.
# 참고: http://www.gradle.org/docs/current/userguide/build_environment.html
# 아래 옵션은 Gradle 데몬의 JVM 메모리 및 문자 인코딩을 지정합니다.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 병렬 빌드 옵션 예시입니다. 현재는 비활성화되어 있습니다.
# 참고: https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Configuration Cache: 빌드 구성에 변화가 없으면 설정 단계를 재사용해 빌드 시간을 줄입니다.
org.gradle.configuration-cache=true
# Kotlin 코드 스타일 설정: official 또는 obsolete
kotlin.code.style=official